version: 2

models:
  - name: fact_climate_population
    description: "The final optimized fact table."
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - country_code
            - record_date

    columns:
      - name: country_code
        tests:
          - not_null
          - dbt_expectations.expect_column_value_lengths_to_equal:
              value: 3

      - name: record_date
        tests:
          - not_null

      - name: annual_avg_temp
        tests:
          - not_null

      - name: population
        tests:
          - not_null